[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeforge"
version = "0.1.0"
description = "Local coding agent harness using a unified OpenAI-compatible Chat Completions model interface"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codeforge = "codeforge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools]
packages = ["codeforge"]
